[workspace]
resolver = "2"
members = ["crates/masaya-core", "crates/masaya-nsh"]
# The app (`masaya-nsh`) is macOS-only. On other systems build and test the core alone with
# `-p masaya-core`, as CI does on Linux.
default-members = ["crates/masaya-core", "crates/masaya-nsh"]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "UNLICENSED"
authors = ["Manuel Duarte"]
repository = "https://github.com/momotombodevs/masaya-mirror"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
# A panic in a background task must not take the whole app down.
panic = "unwind"
strip = true
