name: Release Desktop

on:
  push:
    tags:
      - 'v*'

jobs:
  build-native:
    name: Build ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macOS DMG
            runner: macos-14
            build_command: pnpm build:mac
            artifact_name: manolo-mirror-macos
            artifact_path: release/**/*.dmg
          - name: Windows NSIS
            runner: windows-latest
            build_command: pnpm build:win
            artifact_name: manolo-mirror-windows
            artifact_path: release/**/*.exe
          - name: Linux AppImage
            runner: ubuntu-latest
            build_command: pnpm build:linux
            artifact_name: manolo-mirror-linux
            artifact_path: release/**/*.AppImage
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download scrcpy-server bundle
        run: pnpm setup:tools

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm test

      - name: Package desktop app
        run: ${{ matrix.platform.build_command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.artifact_name }}
          path: ${{ matrix.platform.artifact_path }}
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build-native
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/**/*.dmg
            release-artifacts/**/*.exe
            release-artifacts/**/*.AppImage
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## Desktop installers

            ### macOS

            Download the DMG asset below.

            **First launch:** if macOS blocks the app, right-click the app and choose **Open**, or allow it under **System Settings → Privacy & Security**.

            ### Windows

            Download the NSIS installer `.exe` below.

            ### Linux

            Download the `AppImage` below and mark it executable before running it.

            **Requirements:** `adb` (Android platform-tools) must be installed on the target machine. The app does not bundle ADB.
