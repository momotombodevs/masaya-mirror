name: Rust

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Version is new
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch main
        run: git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
      # Newer than main's version, and its tag does not exist yet.
      - name: Bump the workspace version before merging to main
        run: sh scripts/check-version.sh origin/main

  core:
    name: Core (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Formatting covers the whole workspace, the app included.
      - run: cargo fmt --all --check
      - run: cargo clippy -p masaya-core --all-targets -- -D warnings
      - run: cargo test -p masaya-core

  nsh:
    name: NSH app (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p masaya-nsh --all-targets -- -D warnings
      - run: cargo test -p masaya-nsh
