name: Release

# Manual only. Phase F5 of docs/plans/etapa-2-nsh.md adds the signed and notarized .app, the DMG and
# the GitHub Release. Until then this builds an unsigned binary for testing.
on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build masaya-nsh (macOS, unsigned)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch main
        run: git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
      # From any branch but main the version must be newer than main's; on main, where it is equal
      # after the merge, only the tag check applies. Either way the tag v<version> must not exist.
      - id: version
        name: Read the version and check that it is new
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            version="$(sh scripts/check-version.sh)"
          else
            version="$(sh scripts/check-version.sh origin/main)"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p masaya-nsh
      # A tarball keeps the binary's exec bit (upload-artifact alone would drop it). The binary does
      # not find the jar in this layout by itself: testers set MASAYA_SCRCPY_SERVER, see
      # docs/RELEASING.md. F5 replaces this with the .app, whose Resources the lookup does cover.
      - name: Package the binary and scrcpy-server
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          # No AppleDouble (._*) entries for extended attributes.
          COPYFILE_DISABLE: 1
        run: |
          name="masaya-nsh-v${VERSION}-macos-arm64-unsigned"
          staging="${RUNNER_TEMP}/${name}"
          mkdir -p "${staging}/resources/scrcpy-server"
          cp target/release/masaya-nsh "${staging}/masaya-nsh"
          chmod 755 "${staging}/masaya-nsh"
          cp resources/scrcpy-server/scrcpy-server.jar "${staging}/resources/scrcpy-server/scrcpy-server.jar"
          tar -czf "${name}.tar.gz" -C "${staging}" .
          tar -tvzf "${name}.tar.gz"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.name }}.tar.gz
          if-no-files-found: error
