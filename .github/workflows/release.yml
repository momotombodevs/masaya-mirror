name: Release

# Manual only. Phase F5 of docs/plans/etapa-2-nsh.md adds the signed and notarized .app, the DMG and
# the GitHub Release. Until then this builds an unsigned binary for testing.
on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build masaya-nsh (macOS, unsigned)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch main
        run: git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
      # From any branch but main the version must be newer than main's; on main, where it is equal
      # after the merge, only the tag check applies. Either way the tag v<version> must not exist.
      - id: version
        name: Read the version and check that it is new
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            version="$(sh scripts/check-version.sh)"
          else
            version="$(sh scripts/check-version.sh origin/main)"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p masaya-nsh
      - uses: actions/upload-artifact@v4
        with:
          name: masaya-nsh-v${{ steps.version.outputs.version }}-macos-arm64-unsigned
          path: target/release/masaya-nsh
          if-no-files-found: error
