name: Release

# Manual only. Phase F5 of docs/plans/etapa-2-nsh.md adds the signed and notarized .app, the DMG and
# the GitHub Release. Until then this builds an unsigned binary for testing.
on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build masaya-nsh (macOS, unsigned)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Read the version and check that its tag is new
        run: |
          version="$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version *= *"\(.*\)"/\1/p' Cargo.toml)"
          if [ -z "${version}" ]; then
            echo "Could not read [workspace.package] version from Cargo.toml." >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v${version}" > /dev/null; then
            echo "v${version} is already released; bump [workspace.package] version in Cargo.toml." >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p masaya-nsh
      - uses: actions/upload-artifact@v4
        with:
          name: masaya-nsh-v${{ steps.version.outputs.version }}-macos-arm64-unsigned
          path: target/release/masaya-nsh
          if-no-files-found: error
