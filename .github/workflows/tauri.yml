name: Tauri

on:
  push:
    branches: [main, develop]
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'src-tauri/**'
      - 'vite.config.tauri.ts'
      - 'src/**'
      - '.github/workflows/tauri.yml'

concurrency:
  group: tauri-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy -p masaya-core --all-targets -- -D warnings
      - run: cargo test -p masaya-core

  shell:
    name: Shell (Windows)
    needs: core
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      # tauri.conf.json points at dist-tauri, which the build script reads while compiling.
      - run: pnpm build:web
      - run: cargo check -p masaya-desktop
